name: Helm lint and template

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm-lint.yml"
  pull_request:
    paths:
      - "charts/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Helm lint
        run: helm lint charts/pr-reviewer

      - name: Helm template (dev overlay)
        run: |
          helm template pr-reviewer charts/pr-reviewer \
            -f gitops/install/overlays/dev/values.yaml \
            --set admin.email=test@example.com \
            --dry-run > /dev/null
          echo "Helm template succeeded."
