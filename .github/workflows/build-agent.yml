name: Build and push pr-reviewer-agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

env:
  IMAGE: quay.io/sshaaf/pr-reviewer-agent

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max



      - name: Smoke test
        run: |
          chmod +x agent/scripts/smoke-test.sh
          SMOKE_TEST_PASSWORD=ci-smoke agent/scripts/smoke-test.sh ${{ env.IMAGE }}:ci
        env:
          SMOKE_TEST_TIMEOUT_SECONDS: 90

      - name: E2E coolstore review smoke
        if: ${{ secrets.LITELLM_API_KEY != '' }}
        run: |
          chmod +x agent/scripts/e2e-review-smoke.sh
          # rgctl needed on runner to seed .rgctl-base
          # Host rgctl for seeding .rgctl-base (glibc ubuntu runner)
          curl -fsSL -o /tmp/rgctl.tgz \
            "https://github.com/sshaaf/rgctl/releases/download/v0.4.19/rgctl-0.4.19-x86_64-unknown-linux-gnu.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/rgctl.tgz rgctl

          SMOKE_TEST_PASSWORD=ci-e2e \
            LITELLM_API_KEY="${{ secrets.LITELLM_API_KEY }}" \
            LITELLM_BASE_URL="${{ secrets.LITELLM_BASE_URL }}" \
            LITELLM_MODEL="${{ secrets.LITELLM_MODEL }}" \
            agent/scripts/e2e-review-smoke.sh ${{ env.IMAGE }}:ci
        env:
          E2E_TIMEOUT_SECONDS: 900

      - name: Log in to Quay.io
        if: success()
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
