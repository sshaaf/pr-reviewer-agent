name: Build and push pr-reviewer-agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

env:
  IMAGE: quay.io/lightwell/pr-reviewer-agent

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          chmod +x agent/scripts/smoke-test.sh
          SMOKE_TEST_PASSWORD=ci-smoke agent/scripts/smoke-test.sh ${{ env.IMAGE }}:ci
        env:
          SMOKE_TEST_TIMEOUT_SECONDS: 90

      - name: Log in to Quay.io
        if: success()
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
