name: Build and push pr-reviewer-trigger

on:
  push:
    branches: [main]
    paths:
      - "trigger/**"
      - "agent/scripts/review-workspace.sh"
      - ".github/workflows/build-trigger.yml"

env:
  IMAGE: quay.io/sshaaf/pr-reviewer-trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: trigger/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — trigger --help / import
        run: |
          docker run --rm --entrypoint python3 ${{ env.IMAGE }}:ci -c "import ast; ast.parse(open('/app/trigger/app.py').read())"
          docker run --rm --entrypoint test ${{ env.IMAGE }}:ci -x /app/scripts/review-workspace.sh

      - name: Log in to Quay.io
        if: success()
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          file: trigger/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
