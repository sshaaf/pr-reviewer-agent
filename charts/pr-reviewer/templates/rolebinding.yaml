apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pr-reviewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pr-reviewer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pr-reviewer
subjects:
  - kind: ServiceAccount
    name: pr-reviewer
    namespace: {{ .Release.Namespace }}
