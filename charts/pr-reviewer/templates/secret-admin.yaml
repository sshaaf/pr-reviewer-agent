{{- $existing := lookup "v1" "Secret" .Release.Namespace "pr-reviewer-admin" }}
{{- $password := "" }}
{{- if $existing }}
  {{- $password = index $existing.data "password" | b64dec }}
{{- else }}
  {{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: pr-reviewer-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pr-reviewer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  email: {{ .Values.admin.email | quote }}
  password: {{ $password | quote }}
