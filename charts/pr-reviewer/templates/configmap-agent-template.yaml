apiVersion: v1
kind: ConfigMap
metadata:
  name: pr-reviewer-agent-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pr-reviewer.labels" . | nindent 4 }}
data:
  deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: "{{`{{NAME}}`}}"
      namespace: "{{`{{NAMESPACE}}`}}"
      labels:
        app: pr-reviewer-agent
        repo: "{{`{{SLUG}}`}}"
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: pr-reviewer-agent
          repo: "{{`{{SLUG}}`}}"
      template:
        metadata:
          labels:
            app: pr-reviewer-agent
            repo: "{{`{{SLUG}}`}}"
        spec:
          serviceAccountName: pr-reviewer
          securityContext:
            runAsUser: 1001
            runAsGroup: 0
            fsGroup: 0
          volumes:
            - name: rgctl-db
              persistentVolumeClaim:
                claimName: "{{`{{PVC_NAME}}`}}"
            - name: tmp
              emptyDir: {}
          containers:
            - name: agent
              image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
              imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
              ports:
                - containerPort: 4096
              env:
                - name: REPO_URL
                  value: "{{`{{REPO_URL}}`}}"
                - name: RGCTL_DB
                  value: /app/rgctl-db
                - name: OPENCODE_SERVER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.opencodeAgentPasswordSecret | quote }}
                      key: password
              envFrom:
                - secretRef:
                    name: pr-reviewer-llm-keys
                    optional: true
              volumeMounts:
                - name: rgctl-db
                  mountPath: /app/rgctl-db
                - name: tmp
                  mountPath: /tmp
              readinessProbe:
                httpGet:
                  path: /global/health
                  port: 4096
                initialDelaySeconds: 15
                periodSeconds: 10
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
  service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: "{{`{{NAME}}`}}"
      namespace: "{{`{{NAMESPACE}}`}}"
      labels:
        app: pr-reviewer-agent
        repo: "{{`{{SLUG}}`}}"
    spec:
      selector:
        app: pr-reviewer-agent
        repo: "{{`{{SLUG}}`}}"
      ports:
        - port: 4096
          targetPort: 4096
