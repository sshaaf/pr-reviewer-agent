## pr-reviewer Helm values
## Override these in your environment-specific values file.

# ── Images ──────────────────────────────────────────────────────────────────
webApp:
  image:
    repository: quay.io/lightwell/pr-reviewer-ui
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

agent:
  image:
    repository: quay.io/lightwell/pr-reviewer-agent
    tag: latest
    pullPolicy: IfNotPresent

# ── Route (OpenShift) ────────────────────────────────────────────────────────
route:
  enabled: true
  hostname: ""   # e.g. pr-reviewer.apps.cluster.example.com
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# ── Admin ────────────────────────────────────────────────────────────────────
admin:
  email: admin@pr-reviewer.local
  # password: auto-generated and stored in Secret pr-reviewer-admin

# ── Database (PostgreSQL) ────────────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    database: prreviewer
    username: prreviewer
    existingSecret: pr-reviewer-pg-credentials
    secretKeys:
      userPasswordKey: password

# ── Object Storage (S3-compatible for base artifact cache) ──────────────────
objectStorage:
  endpoint: ""         # e.g. https://s3.example.com
  bucket: pr-reviewer
  accessKeySecret: pr-reviewer-s3-credentials
  accessKeySecretKey: access-key
  secretKeySecret: pr-reviewer-s3-credentials
  secretKeySecretKey: secret-key

# ── Review defaults (passed to agent pods) ──────────────────────────────────
reviewDefaults:
  upstreamDepth: 2
  downstreamDepth: 1
  fanout: 10

# ── Nightly re-index CronJob ─────────────────────────────────────────────────
reindex:
  cronEnabled: true
  schedule: "0 2 * * *"    # 02:00 UTC daily
  storageClass: ""          # leave empty to use cluster default

# ── Encryption key for storing app secrets at rest ──────────────────────────
# Must be a 32-byte hex string (64 hex chars). Override in production.
encryptionKeySecret: pr-reviewer-encryption-key

# ── OpenCode agent password (shared secret between webapp and agent pods) ───
opencodeAgentPasswordSecret: pr-reviewer-agent-password

# ── Namespace (used in-cluster by webapp to create agent resources) ──────────
namespace: pr-reviewer
