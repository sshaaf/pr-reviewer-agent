apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pr-reviewer
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route-trigger.yaml
  # Optional debug Route for OpenCode — uncomment if needed:
  # - route-agent.yaml
# Create secrets separately (see secret-example.yaml / README).
images:
  - name: quay.io/sshaaf/pr-reviewer-agent
    newTag: latest
  - name: quay.io/sshaaf/pr-reviewer-trigger
    newTag: latest
