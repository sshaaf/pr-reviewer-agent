apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pr-reviewer-github
resources:
  - ../../base
patches:
  - target:
      kind: Namespace
      name: pr-reviewer
    patch: |-
      - op: replace
        path: /metadata/name
        value: pr-reviewer-github
  - target:
      kind: Deployment
      name: pr-reviewer
    patch: |-
      - op: add
        path: /spec/template/spec/containers/1/env/-
        value:
          name: TRIGGER_PROVIDER
          value: github
      - op: add
        path: /spec/template/spec/containers/1/envFrom/-
        value:
          secretRef:
            name: pr-reviewer-github-app
            optional: true
