# Copy to secret.yaml (do not commit real values) or create with oc/kubectl:
#
#   oc -n pr-reviewer create secret generic pr-reviewer-secrets \
#     --from-literal=LLM_PROVIDER='litellm' \
#     --from-literal=LITELLM_API_KEY='...' \
#     --from-literal=LITELLM_BASE_URL='https://litemaas.example.com/v1' \
#     --from-literal=LITELLM_MODEL='Qwen3.6-35B-A3B' \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=OPENAI_MODEL='gpt-4o' \
#     --from-literal=OPENCODE_SERVER_PASSWORD='...' \
#     --from-literal=GITLAB_TOKEN='glpat-...' \
#     --from-literal=GITLAB_WEBHOOK_SECRET='...'
#
# Select provider with LLM_PROVIDER=litellm|openai, or set OPENCODE_MODEL=openai/gpt-4o
# (full provider/model overrides LLM_PROVIDER). Unused provider keys may be empty.
#
# GitHub App (overlay github / TRIGGER_PROVIDER=github) — separate secret:
#
#   oc -n pr-reviewer-github create secret generic pr-reviewer-github-app \
#     --from-literal=GITHUB_APP_ID='123456' \
#     --from-literal=GITHUB_WEBHOOK_SECRET='...' \
#     --from-literal=GITHUB_BOT_SLUG='rgctl-bot' \
#     --from-file=GITHUB_APP_PRIVATE_KEY=./github-app.pem
#
# See docs/github-app.md for App permissions and webhook URL (/hooks/github).
#
apiVersion: v1
kind: Secret
metadata:
  name: pr-reviewer-secrets
  namespace: pr-reviewer
  labels:
    app.kubernetes.io/name: pr-reviewer
type: Opaque
stringData:
  LLM_PROVIDER: "litellm"
  LITELLM_API_KEY: "REPLACE_ME"
  LITELLM_BASE_URL: "https://litemaas.rhoai.rh-aiservices-bu.com/v1"
  LITELLM_MODEL: "Qwen3.6-35B-A3B"
  OPENAI_API_KEY: ""
  OPENAI_MODEL: "gpt-4o"
  # Optional override, e.g. openai/gpt-4o or litellm/Qwen3.6-35B-A3B
  # OPENCODE_MODEL: ""
  OPENCODE_SERVER_PASSWORD: "REPLACE_ME"
  GITLAB_TOKEN: "REPLACE_ME"
  GITLAB_WEBHOOK_SECRET: "REPLACE_ME"
