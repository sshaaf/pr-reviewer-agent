# Example only — do not apply with real keys committed.
# Create with oc --from-file for the PEM (see docs/github-app.md).
apiVersion: v1
kind: Secret
metadata:
  name: pr-reviewer-github-app
  namespace: pr-reviewer-github
  labels:
    app.kubernetes.io/name: pr-reviewer
type: Opaque
stringData:
  GITHUB_APP_ID: "REPLACE_ME"
  GITHUB_WEBHOOK_SECRET: "REPLACE_ME"
  GITHUB_BOT_SLUG: "rgctl-bot"
  # Multi-line PEM; prefer --from-file=GITHUB_APP_PRIVATE_KEY=./github-app.pem
  GITHUB_APP_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME
    -----END RSA PRIVATE KEY-----
