apiVersion: v1
kind: ConfigMap
metadata:
  name: pr-reviewer-config
  namespace: pr-reviewer
  labels:
    app.kubernetes.io/name: pr-reviewer
data:
  # In-cluster GitLab webservice (adjust to your GitLab Operator/Helm Service).
  GITLAB_URL: "http://gitlab-webservice-default.gitlab.svc:8181"
  # Named bot for @mentions (must match GitLab username of GITLAB_TOKEN). Override in Secret if preferred.
  GITLAB_BOT_USERNAME: "rgctl-bot"
  # litellm | openai — override with OPENCODE_MODEL=provider/model for a one-shot switch
  LLM_PROVIDER: "litellm"
  OPENAI_MODEL: "gpt-4o"
  # Keep max-mem-mb under the container memory limit (4Gi) with headroom for OpenCode/overhead.
  RGCTL_WITH_LIMITS: "max-mem-mb=3072,threads=4"
  REPO_PATH: "/workspace/repo"
  WORKSPACE: "/workspace/repo"
  AGENT_URL: "http://127.0.0.1:4096"
  REVIEW_UPSTREAM_DEPTH: "2"
  REVIEW_DOWNSTREAM_DEPTH: "1"
  REVIEW_FANOUT: "5"
  REVIEW_MAX_SYMBOLS: "25"
  DEBOUNCE_SECONDS: "60"
