# Declarative user list — provisioned by the seed Job on every Argo CD sync.
# The seed Job treats 409 (already exists) as success — safe to re-run.
#
# Schema:
#   email:  string (required) — user's email address
#   role:   "admin" | "user"  (default: user)
#
# Passwords are auto-generated by the webapp on first creation and NOT stored here.
# Retrieve a user's initial credentials via the admin UI or API.
users:
  - email: alice@acme.com
    role: user
  - email: bob@acme.com
    role: user
  - email: carol@acme.com
    role: admin
