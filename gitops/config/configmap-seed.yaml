apiVersion: v1
kind: ConfigMap
metadata:
  name: pr-reviewer-seed
  namespace: pr-reviewer
data:
  users.yaml: |
    # Managed by gitops/config/users.yaml — do not edit directly.
    # Re-apply via Argo CD sync.
    users:
      - email: alice@acme.com
        role: user
      - email: bob@acme.com
        role: user
      - email: carol@acme.com
        role: admin

  repos.yaml: |
    # Managed by gitops/config/repos.yaml — do not edit directly.
    repos:
      - owner: alice@acme.com
        repo_url: https://github.com/acme/payments
        app: github-acme
        config:
          checks: [paths, blast_radius, policy]
          upstream_depth: 2
          downstream_depth: 1
          output_mode: comment

      - owner: alice@acme.com
        repo_url: https://github.com/acme/auth-service
        app: github-acme
        config:
          checks: [paths, blast_radius]
          output_mode: check_run

      - owner: bob@acme.com
        repo_url: https://gitlab.com/acme/legacy-api
        app: gitlab-acme
        config:
          checks: [paths, policy]
          upstream_depth: 3
          output_mode: comment

  run.sh: |
    #!/bin/sh
    set -euo pipefail
    # Sourced via ConfigMap volume mount at /seed/run.sh
    # See gitops/config/job-seed.yaml for the Job spec.
    APP_URL="${APP_URL:?APP_URL required}"
    ADMIN_EMAIL="${ADMIN_EMAIL:-admin@pr-reviewer.local}"
    ADMIN_PASSWORD="${ADMIN_PASSWORD:?ADMIN_PASSWORD required}"

    echo "[seed] Authenticating as ${ADMIN_EMAIL}..."
    TOKEN=$(curl -sf -X POST "${APP_URL}/api/v1/auth/login" \
      -H "Content-Type: application/json" \
      -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}" \
      -c /tmp/cookies.txt -b /tmp/cookies.txt \
      | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
    echo "[seed] Authenticated."

    # Parse and create users
    python3 - <<'PYEOF'
    import json, os, sys, urllib.request, urllib.error

    app_url = os.environ["APP_URL"]
    admin_pass = os.environ["ADMIN_PASSWORD"]
    admin_email = os.environ.get("ADMIN_EMAIL", "admin@pr-reviewer.local")

    import http.cookiejar
    cj = http.cookiejar.CookieJar()
    opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

    # Login
    login_data = json.dumps({"email": admin_email, "password": admin_pass}).encode()
    req = urllib.request.Request(f"{app_url}/api/v1/auth/login",
                                  data=login_data, headers={"Content-Type": "application/json"})
    opener.open(req)
    print("[seed] Logged in.")

    def call(method, path, body=None):
        data = json.dumps(body).encode() if body else None
        headers = {"Content-Type": "application/json"} if data else {}
        req = urllib.request.Request(f"{app_url}{path}", data=data, headers=headers, method=method)
        try:
            resp = opener.open(req)
            return resp.status
        except urllib.error.HTTPError as e:
            return e.code

    import yaml
    with open("/seed/users.yaml") as f:
        users_cfg = yaml.safe_load(f)
    for u in users_cfg.get("users", []):
        code = call("POST", "/api/v1/users", {"email": u["email"], "role": u.get("role","user")})
        if code not in (200, 201, 409):
            print(f"[seed] ERROR creating user {u['email']}: HTTP {code}", file=sys.stderr)
            sys.exit(1)
        print(f"[seed] user {u['email']}: HTTP {code}")

    # Get all users for owner lookup
    req = urllib.request.Request(f"{app_url}/api/v1/users")
    resp = opener.open(req)
    all_users = json.loads(resp.read())
    email_to_id = {u["email"]: u["id"] for u in all_users}

    # Get all apps for app lookup
    req = urllib.request.Request(f"{app_url}/api/v1/apps")
    resp = opener.open(req)
    all_apps = json.loads(resp.read())
    name_to_app_id = {a["name"]: a["id"] for a in all_apps}

    with open("/seed/repos.yaml") as f:
        repos_cfg = yaml.safe_load(f)
    for r in repos_cfg.get("repos", []):
        owner_id = email_to_id.get(r["owner"])
        app_id = name_to_app_id.get(r["app"])
        if not owner_id:
            print(f"[seed] ERROR: owner {r['owner']} not found", file=sys.stderr)
            sys.exit(1)
        if not app_id:
            print(f"[seed] WARN: app {r['app']} not registered, skipping {r['repo_url']}")
            continue
        payload = {"appId": app_id, "repoUrl": r["repo_url"], "config": r.get("config", {})}
        code = call("POST", "/api/v1/repos", payload)
        if code not in (200, 201, 409):
            print(f"[seed] ERROR creating repo {r['repo_url']}: HTTP {code}", file=sys.stderr)
            sys.exit(1)
        print(f"[seed] repo {r['repo_url']}: HTTP {code}")

    print("[seed] Done.")
    PYEOF
