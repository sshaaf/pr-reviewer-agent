apiVersion: batch/v1
kind: Job
metadata:
  name: pr-reviewer-seed
  namespace: pr-reviewer
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
      volumes:
        - name: seed-data
          configMap:
            name: pr-reviewer-seed
            defaultMode: 0755
      containers:
        - name: seed
          image: python:3.11-alpine
          command: ["/bin/sh", "/seed/run.sh"]
          env:
            - name: APP_URL
              value: http://pr-reviewer-webapp.pr-reviewer.svc:3000
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pr-reviewer-admin
                  key: email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pr-reviewer-admin
                  key: password
          volumeMounts:
            - name: seed-data
              mountPath: /seed
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
