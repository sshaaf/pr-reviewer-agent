## Production overlay

route:
  hostname: pr-reviewer.apps.prod.cluster.example.com

webApp:
  image:
    tag: "0.1.0"
  replicaCount: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

agent:
  image:
    tag: "0.1.0"

reindex:
  cronEnabled: true
  schedule: "0 2 * * *"
