apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pr-reviewer-install
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/lightwell/pr-reviewer
    targetRevision: main
    path: charts/pr-reviewer
    helm:
      valueFiles:
        - overlays/dev/values.yaml   # override per environment
  destination:
    server: https://kubernetes.default.svc
    namespace: pr-reviewer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
